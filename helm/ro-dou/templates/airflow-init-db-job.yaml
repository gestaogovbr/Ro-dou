apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ro-dou.fullname" . }}-airflow-db-init
  labels:
    {{- include "ro-dou.labels" . | nindent 4 }}
    app: airflow
spec:
  template:
    metadata:
      labels:
        app: airflow-db-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: airflow-db-init
          image: {{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy }}
          command: ["airflow", "db", "init"]
          envFrom:
            - configMapRef:
                name: {{ include "ro-dou.fullname" . }}-airflow-config
      restartPolicy: Never
  backoffLimit: 0