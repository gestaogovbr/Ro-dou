apiVersion: batch/v1
kind: CronJob
metadata:
  name: git-rsync-dag-confs
  labels:
    app: git-rsync
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: git-rsync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: git-rsync
              image: alpine:3.18
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "apk add --no-cache git rsync ca-certificates && /scripts/git-rsync.sh"]
              env:
                - name: GIT_REPO
                  value: "https://github.com/your-org/your-repo.git"
                - name: GIT_BRANCH
                  value: "main"
                - name: TARGET_DIR
                  value: "/opt/airflow/dags/ro_dou/dag_confs"
                - name: TARGET_UID
                  value: "50000"
                - name: TARGET_GID
                  value: "0"
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: git-token
                      key: token
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: dag-confs
                  mountPath: /opt/airflow/dags/ro_dou/dag_confs
          volumes:
            - name: scripts
              configMap:
                name: git-rsync-scripts
                defaultMode: 0755
            - name: dag-confs
              persistentVolumeClaim:
                claimName: dag-confs-pvc
